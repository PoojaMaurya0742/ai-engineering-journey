
[project]
name = "day4"
version = "0.1.0"
description = "Day 4 - LLM token usage tracking with Groq"
readme = "README.md"
authors = [
    { name = "Pooja Maurya", email = "pooja.devhub@gmail.com" }
]
requires-python = ">=3.14"
